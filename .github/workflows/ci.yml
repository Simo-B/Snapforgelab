name: CI

on:
  pull_request:
  push:
    branches: [claude/awesome-faraday-f1lckc]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MCP Worker tests
        working-directory: workers/mcp
        run: npm test

      - name: _worker.js is in sync with worker.js + deep-scan.js
        working-directory: workers/mcp
        run: |
          node build-pages-worker.mjs
          git diff --exit-code -- _worker.js || { echo "::error::_worker.js is stale: run 'node build-pages-worker.mjs' in workers/mcp and commit it"; exit 1; }

      - name: Generated site files are in sync with content/guides
        run: |
          python3 scripts/build.py
          git status --porcelain -- public
          test -z "$(git status --porcelain -- public)" || { echo "::error::public/ is stale: run 'python3 scripts/build.py' and commit the result"; exit 1; }
